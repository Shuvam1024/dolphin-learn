name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dolphin
          POSTGRES_PASSWORD: dolphin
          POSTGRES_DB: dolphin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphin -d dolphin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dolphin:dolphin@localhost:5432/dolphin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: Lint, typecheck, migrate, test
        run: |
          python -m ruff check services/api/app services/api/tests
          cd services/api && python -m mypy app && python -m alembic upgrade head && python -m pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and check web
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run lint
          npm --prefix apps/web exec -- tsc --noEmit
          npm --prefix apps/web test

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dolphin
          POSTGRES_PASSWORD: dolphin
          POSTGRES_DB: dolphin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphin -d dolphin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dolphin:dolphin@127.0.0.1:5432/dolphin
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API and web
        run: |
          python -m pip install -r services/api/requirements.txt
          cd services/api && python -m alembic upgrade head
          npm --prefix apps/web ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Phase 0 browser smoke
        working-directory: apps/web
        run: npx playwright test
        env:
          API_PYTHON: python

  perf-a11y:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dolphin
          POSTGRES_PASSWORD: dolphin
          POSTGRES_DB: dolphin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphin -d dolphin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dolphin:dolphin@127.0.0.1:5432/dolphin
      CI: "true"
      DOLPHIN_PERF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API and web
        run: |
          python -m pip install -r services/api/requirements-dev.txt
          cd services/api && python -m alembic upgrade head && python -m app.seed
          npm --prefix apps/web ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: API latency budgets
        run: cd services/api && DOLPHIN_PERF=1 python -m pytest tests/perf -s
      - name: Axe baseline
        working-directory: apps/web
        run: npx playwright test e2e/a11y.spec.ts --reporter=line
        env:
          API_PYTHON: python
      - name: Upload a11y baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-baseline
          path: apps/web/e2e/a11y-baseline.json
          if-no-files-found: warn
      - name: Page perf budgets
        working-directory: apps/web
        run: npx playwright test -c playwright.perf.config.ts --reporter=line
        env:
          API_PYTHON: python

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate content
        run: |
          python -m pip install -r services/api/requirements.txt
          cd services/api
          python -m app.content.validate
          python -m app.content.audit
          test -f ../docs/evaluations/content-audit.md
      - name: Fail on unreviewed fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import tempfile, shutil, subprocess, sys
          src = Path("content/python/names.md")
          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp) / "content"
              shutil.copytree("content", root)
              text = (root / "python" / "names.md").read_text()
              text = text.replace("reviewed_by: curriculum", "reviewed_by: ''")
              (root / "python" / "names.md").write_text(text)
              proc = subprocess.run(
                  [sys.executable, "-m", "app.content.validate", str(root)],
                  cwd="services/api",
                  capture_output=True,
                  text=True,
              )
              assert proc.returncode != 0, proc.stdout + proc.stderr
              assert "review_stamp_required" in proc.stdout or "review_stamp_required" in proc.stderr
          print("unreviewed fixture rejected")
          PY

  ai-fake:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dolphin
          POSTGRES_PASSWORD: dolphin
          POSTGRES_DB: dolphin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphin -d dolphin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dolphin:dolphin@localhost:5432/dolphin
      AI_GATEWAY_ENABLED: "true"
      AI_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r services/api/requirements-dev.txt
      - name: AI fake provider suite
        run: |
          cd services/api && python -m alembic upgrade head && python -m pytest tests/test_ai_gateway.py tests/test_ai_import_graph.py -q

  release-suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [off, fake]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dolphin
          POSTGRES_PASSWORD: dolphin
          POSTGRES_DB: dolphin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphin -d dolphin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dolphin:dolphin@127.0.0.1:5432/dolphin
      CI: "true"
      DOLPHIN_E2E_FAST_CLOCK: "1"
      AI_PROVIDER: ${{ matrix.mode == 'fake' && 'fake' || '' }}
      AI_GATEWAY_ENABLED: ${{ matrix.mode == 'fake' && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install API and web
        run: |
          python -m pip install -r services/api/requirements.txt
          cd services/api && python -m alembic upgrade head && python -m app.seed
          npm --prefix apps/web ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Golden release suite (${{ matrix.mode }})
        working-directory: apps/web
        run: npx playwright test -c playwright.release.config.ts --reporter=line
        env:
          API_PYTHON: python
