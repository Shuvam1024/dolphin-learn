- id: reading-1
  type: reading
  prompt: Read the note on numerators and denominators.
  effort_minutes:
    low: 4
    high: 6
- id: objective-2
  type: objective
  prompt: 'In 3/4, what does the 4 name?


    a) How many parts you have

    b) How many equal parts make the whole

    c) The sum of the parts'
  choices:
  - How many parts you have
  - How many equal parts make the whole
  - The sum of the parts
  answer: b
  explanation: The denominator names the size of each equal part of the whole.
  misconceptions:
    a: That is the numerator.
    c: The denominator is not a sum.
  difficulty: 1
  effort_minutes:
    low: 3
    high: 5
- id: objective-3
  type: objective
  prompt: 'Which phrase matches 2/5?


    a) Two fifths of one whole

    b) Five halves of one whole

    c) Two plus five'
  choices:
  - Two fifths of one whole
  - Five halves of one whole
  - Two plus five
  answer: a
  explanation: Numerator counts parts; denominator sizes them.
  misconceptions:
    b: That swaps the roles.
    c: A fraction is not an addition problem.
  difficulty: 1
  effort_minutes:
    low: 2
    high: 3
- id: numeric-4
  type: numeric
  prompt: A pizza is cut into equal slices. The denominator on the label is eight. How many slices make one whole pizza?
  answer: '8'
  tolerance: 0
  explanation: The denominator names how many equal parts make the whole.
  misconceptions:
    other: The denominator is the size count for one whole, not the parts you hold.
  difficulty: 1
  effort_minutes:
    low: 2
    high: 3
