- id: objective-2
  type: objective
  prompt: 'What makes two fractions equivalent?


    a) they look identical


    b) they name the same amount


    c) they share a digit'
  choices:
  - they look identical
  - they name the same amount
  - they share a digit
  answer: b
  explanation: 'The reading supports: they name the same amount.'
  misconceptions:
    a: That does not match the reading.
    c: That does not match the reading.
  difficulty: 3
  effort_minutes:
    low: 3
    high: 5
