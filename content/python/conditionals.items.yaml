- id: reading-1
  type: reading
  prompt: Read the note on choosing with if. You are not scored for reading.
  effort_minutes:
    low: 5
    high: 8
- id: objective-2
  type: objective
  prompt: 'In `if n > 2:`, what is the condition?


    a) The assignment `n = 2`

    b) The comparison `n > 2`

    c) The function call `if`'
  choices:
  - The assignment `n = 2`
  - The comparison `n > 2`
  - The function call `if`
  answer: b
  explanation: The condition is the Boolean comparison.
  misconceptions:
    a: '`>` is not assignment.'
    c: '`if` is not a function call here.'
  difficulty: 1
  effort_minutes:
    low: 3
    high: 5
- id: objective-3
  type: objective
  prompt: "If `n` is bound to 1, which branch runs?\n\n```\nif n > 2:\n    print(\"\
    big\")\nelse:\n    print(\"small\")\n```\n\na) The `if` body\nb) The `else` body\n\
    c) Both bodies"
  choices:
  - The `if` body
  - The `else` body
  - Both bodies
  answer: b
  explanation: The condition is false, so the else branch runs.
  misconceptions:
    a: 1 is not greater than 2, so the if body is skipped.
    c: Only one branch runs.
  difficulty: 2
  effort_minutes:
    low: 4
    high: 6
- id: objective-4
  type: objective
  prompt: 'Which line is a condition, not an assignment?


    a) `n = 3`

    b) `n > 2`

    c) `print(n)`'
  choices:
  - '`n = 3`'
  - '`n > 2`'
  - '`print(n)`'
  answer: b
  explanation: Comparison produces a Boolean; assignment uses `=`.
  misconceptions:
    a: That assigns.
    c: That is a call.
  difficulty: 2
  effort_minutes:
    low: 3
    high: 5
